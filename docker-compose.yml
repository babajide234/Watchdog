services:
  postgres:
    image: postgres:16
    container_name: watchdog_db
    restart: always
    environment:
      POSTGRES_DB: watchdog
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog -d watchdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: watchdog_api
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://watchdog:watchdog@postgres:5432/watchdog
      NODE_ENV: production
      PORT: "4000"

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: watchdog_dashboard
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - api

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: watchdog_landing
    restart: always
    ports:
      - "3000:3000"

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    container_name: watchdog_docs
    restart: always
    ports:
      - "3002:3002"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: watchdog_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@watchdog.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
